name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The repository currently carries a Bun lockfile and a stale npm lockfile.
      # npm ci would reject that lockfile before validation can run. Resolve from
      # package.json until a canonical package-lock.json is intentionally generated.
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Typecheck / lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test
