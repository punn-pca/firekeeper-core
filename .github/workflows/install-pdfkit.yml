name: Install PDFKit dependencies
on:
  push:
    paths:
      - '.github/workflows/install-pdfkit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PDFKit and TypeScript definitions
        run: |
          npm install --save-exact pdfkit
          npm install --save-dev --save-exact @types/pdfkit
          npm ci
      - name: Commit dependency manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependencies already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: install pdfkit and types"
          git push
