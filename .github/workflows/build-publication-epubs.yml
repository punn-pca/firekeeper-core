name: Build Publication EPUBs

on:
  push:
    branches:
      - main
      - feat/publication-per-book-reader
    paths:
      - 'firekeeper_publication/Firekeeper_Practical_Guide.md'
      - 'firekeeper_publication/Firekeeper_Case_Studies.md'
      - 'firekeeper_publication/Firekeeper_Quick_Start.md'
      - 'firekeeper_publication/Firekeeper_AI_Governance.md'
      - '.github/workflows/build-publication-epubs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EPUB 3 files from canonical Markdown
        shell: python
        run: |
          import html, os, re, zipfile, tempfile, shutil, xml.etree.ElementTree as ET

          books = [
            ("Firekeeper_Practical_Guide", "FIRE KEEPER Practical Guide"),
            ("Firekeeper_Case_Studies", "FIRE KEEPER Case Studies"),
            ("Firekeeper_Quick_Start", "FIRE KEEPER Quick Start"),
            ("Firekeeper_AI_Governance", "FIRE KEEPER AI Governance"),
          ]
          out_dir = "public/firekeeper_publication"
          os.makedirs(out_dir, exist_ok=True)

          def inline(s):
              s = html.escape(s)
              s = re.sub(r"\*\*(.+?)\*\*", r"<strong>\1</strong>", s)
              s = re.sub(r"\*(.+?)\*", r"<em>\1</em>", s)
              s = re.sub(r"`(.+?)`", r"<code>\1</code>", s)
              return s

          def markdown_to_xhtml(text):
              blocks=[]; para=[]; in_code=False; code=[]
              def flush():
                  if para:
                      blocks.append("<p>"+inline(" ".join(para))+"</p>"); para.clear()
              for raw in text.replace("\r","").split("\n"):
                  t=raw.strip()
                  if t.startswith("```"):
                      flush()
                      if in_code:
                          blocks.append("<pre><code>"+html.escape("\n".join(code))+"</code></pre>"); code=[]
                      in_code=not in_code; continue
                  if in_code: code.append(raw); continue
                  if not t: flush(); continue
                  m=re.match(r"^(#{1,3})\s+(.+)$",t)
                  if m:
                      flush(); n=len(m.group(1)); blocks.append(f"<h{n}>{inline(m.group(2))}</h{n}>")
                  elif t=="---": flush(); blocks.append("<hr/>")
                  elif t.startswith(">"): flush(); blocks.append("<blockquote>"+inline(t.lstrip("> ").strip())+"</blockquote>")
                  elif re.match(r"^[-*]\s+",t): flush(); blocks.append("<p>• "+inline(re.sub(r"^[-*]\s+","",t))+"</p>")
                  elif re.match(r"^\d+\.\s+",t): flush(); blocks.append("<p>"+inline(t)+"</p>")
                  else: para.append(t)
              flush()
              return "\n".join(blocks)

          for stem, title in books:
              md=f"firekeeper_publication/{stem}.md"
              text=open(md,encoding="utf-8").read()
              body=markdown_to_xhtml(text)
              with tempfile.TemporaryDirectory() as root:
                  meta=os.path.join(root,"META-INF"); oebps=os.path.join(root,"OEBPS")
                  os.makedirs(meta); os.makedirs(oebps)
                  open(os.path.join(root,"mimetype"),"w",encoding="ascii").write("application/epub+zip")
                  open(os.path.join(meta,"container.xml"),"w",encoding="utf-8").write("""<?xml version="1.0"?>
          <container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>""")
                  xhtml=f"""<?xml version="1.0" encoding="utf-8"?>
          <!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" lang="th"><head><title>{html.escape(title)}</title><link rel="stylesheet" href="styles.css" type="text/css"/></head><body>{body}</body></html>"""
                  open(os.path.join(oebps,"book.xhtml"),"w",encoding="utf-8").write(xhtml)
                  open(os.path.join(oebps,"styles.css"),"w",encoding="utf-8").write("body{font-family:sans-serif;line-height:1.7;margin:5%;}h1,h2,h3{page-break-after:avoid;}pre{white-space:pre-wrap;}blockquote{border-left:3px solid #999;padding-left:1em;}")
                  nav=f"""<?xml version="1.0" encoding="utf-8"?><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="th"><head><title>สารบัญ</title></head><body><nav epub:type="toc"><h1>สารบัญ</h1><ol><li><a href="book.xhtml">{html.escape(title)}</a></li></ol></nav></body></html>"""
                  open(os.path.join(oebps,"nav.xhtml"),"w",encoding="utf-8").write(nav)
                  opf=f"""<?xml version="1.0" encoding="utf-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="bookid">{stem.lower()}</dc:identifier><dc:title>{html.escape(title)}</dc:title><dc:language>th</dc:language><dc:creator>PUNN</dc:creator></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="book" href="book.xhtml" media-type="application/xhtml+xml"/><item id="css" href="styles.css" media-type="text/css"/></manifest><spine><itemref idref="book"/></spine></package>"""
                  open(os.path.join(oebps,"content.opf"),"w",encoding="utf-8").write(opf)
                  ET.parse(os.path.join(oebps,"book.xhtml")); ET.parse(os.path.join(oebps,"nav.xhtml")); ET.parse(os.path.join(oebps,"content.opf"))
                  out=os.path.join(out_dir,stem+".epub")
                  with zipfile.ZipFile(out,"w") as z:
                      z.write(os.path.join(root,"mimetype"),"mimetype",compress_type=zipfile.ZIP_STORED)
                      for base,_,files in os.walk(root):
                          for fn in files:
                              p=os.path.join(base,fn); rel=os.path.relpath(p,root).replace(os.sep,"/")
                              if rel=="mimetype": continue
                              z.write(p,rel,compress_type=zipfile.ZIP_DEFLATED)
                  with zipfile.ZipFile(out) as z:
                      assert z.namelist()[0]=="mimetype"
                      assert z.read("mimetype")==b"application/epub+zip"
                      assert z.testzip() is None

      - name: Commit generated EPUB files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/firekeeper_publication/Firekeeper_Practical_Guide.epub \
                  public/firekeeper_publication/Firekeeper_Case_Studies.epub \
                  public/firekeeper_publication/Firekeeper_Quick_Start.epub \
                  public/firekeeper_publication/Firekeeper_AI_Governance.epub
          git diff --cached --quiet || git commit -m "docs: build publication EPUBs"
          git push
