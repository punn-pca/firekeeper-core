name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Contextual search regression
        run: node --import tsx scripts/testContextualSearchResolver.ts
      - name: Quota and request-state regressions
        run: |
          node --import tsx scripts/testAnalysisQuotaBoundary.ts
          node --import tsx scripts/testAnalysisRequestIdempotency.ts
          node --import tsx scripts/testAnalysisRequestFailureState.ts
      - name: Core tests
        run: npm run test:core
