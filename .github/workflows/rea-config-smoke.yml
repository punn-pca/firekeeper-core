name: REA MCP config smoke
on:
  pull_request:
    paths:
      - 'config/rea.mcp.example.json'
      - 'scripts/testReaConfig.mjs'
      - '.github/workflows/rea-config-smoke.yml'
      - 'docs/REA_INTEGRATION.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/testReaConfig.mjs
