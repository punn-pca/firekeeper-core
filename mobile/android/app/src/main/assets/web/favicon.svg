<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Border rim subtle gradient -->
    <linearGradient id="fk_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#D97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient warmth aura -->
    <radialGradient id="fk_aura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 295) rotate(90) scale(180)">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#EA580C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer flame gradient -->
    <linearGradient id="fk_flame" x1="256" y1="90" x2="256" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="18%" stop-color="#F59E0B"/>
      <stop offset="62%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#B43403"/>
    </linearGradient>

    <!-- Inner ember core gradient -->
    <linearGradient id="fk_ember" x1="256" y1="220" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark minimal squircle container -->
  <rect width="512" height="512" rx="116" fill="#070A11"/>
  <rect x="2" y="2" width="508" height="508" rx="114" stroke="url(#fk_rim)" stroke-width="2.5"/>
  
  <!-- Subtle ambient ember glow -->
  <circle cx="256" cy="295" r="180" fill="url(#fk_aura)"/>

  <!-- Centered Iconic Flame Geometry -->
  <g transform="matrix(18 0 0 18 40 31)">
    <!-- Primary flame body -->
    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" 
          fill="url(#fk_flame)"/>
    
    <!-- Luminous inner ember heart -->
    <path d="M9.6 15.8c-0.4-0.6-0.6-1.3-0.6-2 0-0.7 0.3-1.3 0.6-1.8 0.2-0.4 0.4-0.8 0.4-1.2 0.6 0.7 1.1 1.4 1.1 2.3 0 0.7-0.3 1.3-0.6 1.7-0.3 0.4-0.5 0.8-0.5 1.2 0.2 0 0.5-0.1 0.7-0.4 0.2 0.5 0.2 1.1-0.2 1.5-0.4 0.4-0.9 0.6-1.4 0.6-1 0-1.7-0.8-1.7-1.7 0-0.4 0.2-0.8 0.5-1.1 0.3 0.6 0.7 1 1.1 1.3z" 
          fill="url(#fk_ember)"/>
  </g>
</svg>
