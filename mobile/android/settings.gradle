pluginManagement {
  def reactNativeGradlePlugin = file("../node_modules/@react-native/gradle-plugin").absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = file("../node_modules/expo-modules-autolinking/android/expo-gradle-plugin").absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  def cleanScript = file("../scripts/clean-autolink-config.js").absolutePath
  def cleanCmd = ["node", cleanScript]
  ex.autolinkLibrariesFromCommand(cleanCmd)
}
expoAutolinking {
  projectRoot = file("..")
}
expoAutolinking.useExpoModules()

rootProject.name = 'FIRE KEEPER'

expoAutolinking.useExpoVersionCatalog(file("../node_modules/react-native/gradle/libs.versions.toml").absolutePath, null)

include ':app'
includeBuild(file("../node_modules/@react-native/gradle-plugin").absolutePath)
