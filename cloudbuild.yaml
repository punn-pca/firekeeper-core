steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_ENTERPRISE_OIDC_PROVIDER_ID=${_ENTERPRISE_OIDC_PROVIDER_ID}'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fire-keeper-punn-cognitive-architecture:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fire-keeper-punn-cognitive-architecture:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fire-keeper-punn-cognitive-architecture:$COMMIT_SHA"
        for attempt in 1 2 3 4 5; do
          log_file="$(mktemp)"
          if gcloud run deploy fire-keeper-punn-cognitive-architecture \
            --image "$$IMAGE" \
            --region asia-southeast1 \
            --platform managed \
            --quiet 2>&1 | tee "$$log_file"; then
            rm -f "$$log_file"
            exit 0
          fi
          if ! grep -Eq "ABORTED: Conflict for resource|version .* was specified but current version" "$$log_file"; then
            rm -f "$$log_file"
            echo "Deploy failed for a reason other than a version conflict; not retrying." >&2
            exit 1
          fi
          rm -f "$$log_file"
          if [ "$$attempt" -eq 5 ]; then
            echo "Cloud Run version conflict persisted after 5 attempts." >&2
            exit 1
          fi
          echo "Cloud Run version conflict; retrying in 15 seconds (attempt $$attempt/5)..."
          sleep 15
        done

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fire-keeper-punn-cognitive-architecture:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _ENTERPRISE_OIDC_PROVIDER_ID: ''
