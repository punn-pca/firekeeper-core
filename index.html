            test.removeItem('__test_sandbox__');
          } else {
            localStorageInsecure = true;
          }
        } catch (e) {

        if (localStorageInsecure) {

          if (typeof Window !== 'undefined' && Window.prototype) {

        // 2. Check & Override sessionStorage
        var sessionStorageInsecure = false;

        }

        // 3. Check & Override indexedDB

        }
